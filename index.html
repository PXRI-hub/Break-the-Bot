<!DOCTYPE html>
<html>
<head>
  <title>Break the Bot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <div id="title">BREAK THE BOT</div>

    <div id="controls">
      <div id="levelButtons"></div>
      <div id="modelButtons">
        <button id="model0" class="mdl" onclick="selectModel(0)">1B small</button>
        <button id="model1" class="mdl" onclick="selectModel(1)">3B bigger</button>
      </div>
    </div>

    <div id="info">
      <div id="levelTitle"></div>
      <div id="levelHint"></div>
      <div id="tries"></div>
    </div>

    <div id="log"></div>

    <div class="bar">
      <input type="text" id="message" placeholder="Try to get the bot to give up its secret word..." autocomplete="off">
      <button id="sendBtn" onclick="send()">Send</button>
    </div>
    <div class="bar" id="guessBar">
      <input type="text" id="guess" placeholder="Think you know it? Type the secret word here" autocomplete="off">
      <button id="guessBtn" onclick="submitGuess()">Submit</button>
    </div>
  </div>
    <!-- popup that appears when a level is beaten -->
  <div id="popup">
    <div id="popupBox">
      <div id="popupTitle"></div>
      <div id="popupText"></div>
      <button id="popupNext" onclick="nextLevel()"></button>
      <button id="popupStay" onclick="closePopup()">Stay here</button>
    </div>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>
