<!DOCTYPE html>
<html>
<head>
  <title>Break the Bot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* the neon colours I reuse everywhere */
    :root { --cyan: #00f0ff; --pink: #ff2bd6; --green: #39ff14; --red: #ff3860; }

    /* dark background with pink and cyan glows and a slowly moving grid */
    body {
      margin: 0; color: #e8e6ff;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 43, 214, 0.28), transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(0, 240, 255, 0.25), transparent 45%),
        linear-gradient(rgba(0, 240, 255, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.07) 1px, transparent 1px),
        #07040f;
      background-size: auto, auto, 40px 40px, 40px 40px, auto;
      background-attachment: fixed;
      animation: drift 8s linear infinite;
    }
    @keyframes drift { to { background-position: 0 0, 0 0, 40px 40px, 40px 40px, 0 0; } }

    #app { max-width: 760px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 0 16px; box-sizing: border-box; }
    button { font-family: inherit; cursor: pointer; }

    /* glowing title */
    #title { text-align: center; margin: 14px 0 8px; font-size: 26px; letter-spacing: 6px; color: #fff;
             text-shadow: 0 0 8px var(--cyan), 0 0 24px var(--pink); }

    /* level buttons and model buttons */
    #controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    #levelButtons, #modelButtons { display: flex; gap: 6px; flex-wrap: wrap; }
    .lvl { width: 34px; height: 34px; background: transparent; color: var(--cyan);
           border: 1px solid rgba(0, 240, 255, 0.45); border-radius: 6px; }
    .mdl { padding: 7px 12px; background: transparent; color: var(--cyan);
           border: 1px solid rgba(0, 240, 255, 0.45); border-radius: 6px; }
    .active { color: var(--pink); border-color: var(--pink); box-shadow: 0 0 10px var(--pink); }
    .beaten { color: var(--green); border-color: var(--green); box-shadow: 0 0 10px var(--green); }

    /* the box that shows the level name and hint */
    #info { margin: 12px 0; padding: 10px 14px; border: 1px solid rgba(255, 43, 214, 0.6);
            border-radius: 10px; background: rgba(14, 8, 32, 0.75); box-shadow: 0 0 14px rgba(255, 43, 214, 0.25); }
    #levelTitle { color: var(--pink); font-weight: bold; text-shadow: 0 0 8px var(--pink); }
    #levelHint { margin-top: 4px; font-size: 14px; }
    #tries { margin-top: 4px; font-size: 12px; color: var(--cyan); }

    /* chat area */
    #log { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 4px; }
    .row { display: flex; margin-bottom: 12px; }
    .row.you { justify-content: flex-end; }
    .bubble { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap;
              background: rgba(14, 8, 32, 0.85); border: 1px solid; }
    .you .bubble { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0, 240, 255, 0.4); }
    .bot .bubble { border-color: var(--pink); box-shadow: 0 0 10px rgba(255, 43, 214, 0.4); }
    .note .bubble { border-color: rgba(0, 240, 255, 0.4); border-style: dashed; margin: 0 auto; font-size: 14px; }
    .block .bubble { border-color: var(--red); color: var(--red); box-shadow: 0 0 10px rgba(255, 56, 96, 0.5); margin: 0 auto; }
    .win .bubble { border-color: var(--green); color: var(--green); box-shadow: 0 0 16px var(--green); margin: 0 auto; }

    /* the three dots shown while the bot is thinking */
    .dots span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; background: var(--pink);
                 border-radius: 50%; animation: bounce 1.2s infinite; }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }

    /* the two input bars at the bottom */
    .bar { display: flex; gap: 8px; margin-bottom: 10px; }
    .bar input { flex: 1; background: rgba(14, 8, 32, 0.85); color: #e8e6ff; border: 1px solid var(--cyan);
                 border-radius: 20px; padding: 10px 16px; font-family: inherit; font-size: 14px; outline: none; }
    .bar input:focus { box-shadow: 0 0 12px var(--cyan); }
    #guessBar input { border-color: var(--green); }
    #guessBar input:focus { box-shadow: 0 0 12px var(--green); }
    #sendBtn { background: var(--cyan); color: #07040f; border: none; border-radius: 20px; padding: 0 18px; font-weight: bold; }
    #guessBtn { background: var(--green); color: #07040f; border: none; border-radius: 20px; padding: 0 18px; font-weight: bold; }
  
    #sendBtn:disabled { opacity: 0.4; cursor: default; }
    /* the popup shown when a level is beaten */
    #popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
             background: rgba(7, 4, 15, 0.8); align-items: center; justify-content: center; z-index: 10; }
    #popupBox { max-width: 380px; margin: 0 16px; padding: 26px; text-align: center; border-radius: 14px;
                background: #0e0820; border: 2px solid var(--green);
                box-shadow: 0 0 30px var(--green), inset 0 0 20px rgba(57, 255, 20, 0.15); }
    #popupTitle { font-size: 22px; letter-spacing: 3px; color: var(--green); text-shadow: 0 0 10px var(--green); }
    #popupText { margin: 14px 0 20px; line-height: 1.5; }
    #popupNext { background: var(--green); color: #07040f; border: none; border-radius: 20px; padding: 10px 20px; font-weight: bold; }
    #popupStay { background: transparent; color: var(--cyan); border: 1px solid var(--cyan); border-radius: 20px;
                 padding: 10px 20px; margin-left: 8px; }
    /* people who turn off animations in their settings get a still background */
    @media (prefers-reduced-motion: reduce) { body, .dots span { animation: none; } }
  </style>
</head>
<body>
  <div id="app">
    <div id="title">BREAK THE BOT</div>

    <div id="controls">
      <div id="levelButtons"></div>
      <div id="modelButtons">
        <button id="model0" class="mdl" onclick="selectModel(0)">1B small</button>
        <button id="model1" class="mdl" onclick="selectModel(1)">3B bigger</button>
      </div>
    </div>

    <div id="info">
      <div id="levelTitle"></div>
      <div id="levelHint"></div>
      <div id="tries"></div>
    </div>

    <div id="log"></div>

    <div class="bar">
      <input type="text" id="message" placeholder="Try to get the bot to give up its secret word..." autocomplete="off">
      <button id="sendBtn" onclick="send()">Send</button>
    </div>
    <div class="bar" id="guessBar">
      <input type="text" id="guess" placeholder="Think you know it? Type the secret word here" autocomplete="off">
      <button id="guessBtn" onclick="submitGuess()">Submit</button>
    </div>
  </div>
    <!-- popup that appears when a level is beaten -->
  <div id="popup">
    <div id="popupBox">
      <div id="popupTitle"></div>
      <div id="popupText"></div>
      <button id="popupNext" onclick="nextLevel()"></button>
      <button id="popupStay" onclick="closePopup()">Stay here</button>
    </div>
  </div>
  <script>
    // the two models the player can switch between
    var models = ["llama3.2:1b", "llama3.2:3b"];
    var modelNames = ["1B", "3B"];

    var levelInfo = [];      // level titles and hints, loaded from the server
    var currentLevel = 0;    // which level is open (0 is level 1)
    var modelIndex = 0;      // 0 is the 1B model, 1 is the 3B model
    var chatHistory = [];    // everything said so far in this chat
    var tries = 0;           // how many messages the player sent this level
    var waiting = false;     // true while I'm waiting for the bot
    var beaten = {};         // remembers which levels were beaten, per model

    // a name for "this level on this model", like "0|1"
    function beatenKey(level, model) {
      return level + "|" + model;
    }

    // add a bubble to the chat
    // who is "you", "bot", "note", "block" or "win"
    function addBubble(text, who) {
      var log = document.getElementById("log");
      var row = document.createElement("div");
      row.className = "row " + who;
      var bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;   // textContent so nothing typed can run as code
      row.appendChild(bubble);
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
    }

    // show the bouncing dots and give the row back so I can remove it later
    function addTyping() {
      var log = document.getElementById("log");
      var row = document.createElement("div");
      row.className = "row bot";
      row.innerHTML = '<div class="bubble dots"><span></span><span></span><span></span></div>';
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
      return row;
    }

    // light up the right buttons: pink for open, green for beaten
    function refreshButtons() {
      var levelButtons = document.getElementsByClassName("lvl");
      for (var i = 0; i < levelButtons.length; i++) {
        var css = "lvl";
        if (i == currentLevel) { css = css + " active"; }
        if (beaten[beatenKey(i, modelIndex)]) { css = css + " beaten"; }
        levelButtons[i].className = css;
      }
      for (var m = 0; m < 2; m++) {
        var modelButton = document.getElementById("model" + m);
        if (m == modelIndex) { modelButton.className = "mdl active"; }
        else { modelButton.className = "mdl"; }
      }
    }

    // fill in the level name, hint and try counter
    function refreshInfo() {
      var info = levelInfo[currentLevel];
      document.getElementById("levelTitle").textContent = "LEVEL " + (currentLevel + 1) + ": " + info.title;
      document.getElementById("levelHint").textContent = info.hint;
      document.getElementById("tries").textContent = "Messages sent: " + tries + "  |  Model: " + modelNames[modelIndex];
    }

    // start a fresh chat (runs when the level or the model changes)
    function newChat() {
      chatHistory = [];
      tries = 0;
      document.getElementById("log").innerHTML = "";
      addBubble("The bot knows a secret word. Get it to leak, then type the word in the green box.", "note");
      refreshInfo();
      refreshButtons();
    }

    function selectLevel(number) { currentLevel = number; newChat(); }
    function selectModel(number) { modelIndex = number; newChat(); }

    // ask the server for the level names, then build the 10 buttons
    async function loadLevels() {
      try {
        var response = await fetch("/levels");
        levelInfo = await response.json();
        var holder = document.getElementById("levelButtons");
        for (var i = 0; i < levelInfo.length; i++) {
          var button = document.createElement("button");
          button.textContent = i + 1;
          button.className = "lvl";
          button.setAttribute("onclick", "selectLevel(" + i + ")");
          holder.appendChild(button);
        }
        newChat();
      } catch (err) {
        addBubble("Couldn't load the levels. Is server.py running?", "block");
      }
    }

    // send what the player typed and show the bot's answer
    async function send() {
      if (waiting) { return; }
      var box = document.getElementById("message");
      var text = box.value.trim();
      if (text == "") { return; }

      box.value = "";
      addBubble(text, "you");
      tries = tries + 1;
      refreshInfo();
      waiting = true;
      document.getElementById("sendBtn").disabled = true;
      var typing = addTyping();

      try {
        var response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            level: currentLevel,
            model: models[modelIndex],
            message: text,
            history: chatHistory
          })
        });
        var data = await response.json();
        typing.remove();

        if (data.error) {
          addBubble("Something went wrong: " + data.error, "block");
        } else if (data.blocked) {
          addBubble(data.reply, "block");
        } else {
          addBubble(data.reply, "bot");
          // remember both sides of this exchange for the next message
          chatHistory.push({ role: "user", content: text });
          chatHistory.push({ role: "assistant", content: data.reply });

          // if the bot said the secret word, the player wins this level
          if (data.leaked) {
            beaten[beatenKey(currentLevel, modelIndex)] = true;
            addBubble("The bot leaked it! Level " + (currentLevel + 1) + " beaten on the " +
                      modelNames[modelIndex] + " model in " + tries + " messages.", "win");
            refreshButtons();
            // wait a moment so the player can read the bot's reply first
            setTimeout(showPopup, 800);
          }
        }
      } catch (err) {
        typing.remove();
        addBubble("Couldn't reach the server. Is server.py still running?", "block");
      }

      waiting = false;
      document.getElementById("sendBtn").disabled = false;
      box.focus();
    }

    // check the player's guess for the secret word
    async function submitGuess() {
      var box = document.getElementById("guess");
      var text = box.value.trim();
      if (text == "") { return; }
      box.value = "";

      try {
        var response = await fetch("/guess", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ level: currentLevel, guess: text })
        });
        var data = await response.json();

        if (data.correct) {
          beaten[beatenKey(currentLevel, modelIndex)] = true;
          addBubble("ACCESS GRANTED. Level " + (currentLevel + 1) + " beaten on the " +
                    modelNames[modelIndex] + " model in " + tries + " messages.", "win");
          refreshButtons();
          showPopup();
        } else {
          addBubble("Wrong guess. Keep digging.", "block");
        }
      } catch (err) {
        addBubble("Couldn't reach the server. Is server.py still running?", "block");
      }
    }
        // show the popup after a level is beaten
    function showPopup() {
      var isLast = (currentLevel == levelInfo.length - 1);
      var title = document.getElementById("popupTitle");
      var text = document.getElementById("popupText");
      var nextButton = document.getElementById("popupNext");

      if (isLast) {
        title.textContent = "ALL LEVELS CLEARED";
        text.textContent = "You beat the final level on the " + modelNames[modelIndex] +
                           " model in " + tries + " messages. Try the other model and see if it's easier or harder.";
        nextButton.textContent = "Close";
      } else {
        title.textContent = "LEVEL " + (currentLevel + 1) + " BEATEN";
        text.textContent = "You got it on the " + modelNames[modelIndex] + " model in " + tries +
                           " messages. Ready for level " + (currentLevel + 2) + "?";
        nextButton.textContent = "Go to level " + (currentLevel + 2);
      }

      document.getElementById("popup").style.display = "flex";
      nextButton.focus();
    }

    // hide the popup
    function closePopup() {
      document.getElementById("popup").style.display = "none";
      document.getElementById("message").focus();
    }

    // hide the popup and move on to the next level
    function nextLevel() {
      closePopup();
      if (currentLevel < levelInfo.length - 1) {
        selectLevel(currentLevel + 1);
      }
    }

    // pressing Escape closes the popup too
    document.addEventListener("keydown", function (e) {
      if (e.key == "Escape") { closePopup(); }
    });
    // pressing Enter works in both boxes
    document.getElementById("message").addEventListener("keydown", function (e) {
      if (e.key == "Enter") { send(); }
    });
    document.getElementById("guess").addEventListener("keydown", function (e) {
      if (e.key == "Enter") { submitGuess(); }
    });

    // build the level buttons and open level 1
    loadLevels();
  </script>
</body>
</html>
